<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Container Query Demo</title>
  <script src="../../../../css/js/theme-preference.js"></script>
  <link rel="stylesheet" href="../../../../css/main.css">
  <link rel="stylesheet" href="carousel-snap.css">
</head>
<body>
    <nav class="site-nav">
    <details class="theme-menu">
    <summary class="theme-control">
        <span class="visually-hidden">Color scheme</span>
    </summary>
    <div class="theme-extra" role="group" aria-label="Choose color scheme">
        <label class="theme-control theme-pick" data-theme-pick="light">
            <input name="theme-preference" type="radio" value="light">
            <span aria-hidden="true">&#9788;&#65039;</span>
            <span class="visually-hidden">Light</span>
        </label>
        <label class="theme-control theme-pick" data-theme-pick="system">
            <input name="theme-preference" type="radio" value="system" checked>
            <span aria-hidden="true">&#9881;&#65039;</span>
            <span class="visually-hidden">System default</span>
        </label>
        <label class="theme-control theme-pick" data-theme-pick="dark">
            <input name="theme-preference" type="radio" value="dark">
            <span aria-hidden="true">&#127766;</span>
            <span class="visually-hidden">Dark</span>
        </label>
        </div>
    </details>
        <ul>
            <li>
                <a href="../../../../index.html">
                    Home
                </a>
            </li>
        </ul>
    </nav>
    <div class="snap-container">
        <div class="snap-carousel">
            <artical class="carousel-card">
                <img src="../../scroll-snap/photos/blue-spheres.jpg" alt="Blue Spheres">
            </artical>
            <artical class="carousel-card">
                <img src="../../scroll-snap/photos/cube.jpg" alt="Cube">
            </artical>
            <artical class="carousel-card">
                <img src="../../scroll-snap/photos/dark-cubes.jpg" alt="Dark Cubes">
            </artical>
            <artical class="carousel-card">
                <img src="../../scroll-snap/photos/faded.jpg" alt="Faded">
            </artical>
            <artical class="carousel-card">
                <img src="../../scroll-snap/photos/glass.jpg" alt="Glass">
            </artical>
            <artical class="carousel-card">
                <img src="../../scroll-snap/photos/white-sphere.jpg" alt="White Spheres">
            </artical>
        </div>
    </div>

</body>
</html>
